name: Check sheets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sheets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install '.[pdf,dev]'
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check source and geometry
        run: |
          ruff check metronotation scripts tests
          ruff format --check metronotation scripts tests
          python scripts/check_reference.py --require-complete --photos
          python -m unittest discover -s tests -v
          python scripts/update_rhythm_review.py --check
      - name: Build and check sheets
        run: |
          python scripts/build_sheets.py
          python scripts/check_pdf.py output/metro-notation.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: metro-notation
          path: output/
          if-no-files-found: error
          retention-days: 7
      - name: Check published PDF
        run: python scripts/check_pdf.py sheets/metro-notation.pdf
