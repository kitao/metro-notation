name: Check source and distribution
on: [push, pull_request]
jobs:
  integrity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ruff==0.16.8
      - run: ruff check metronotation scripts tests
      - run: ruff format --check metronotation scripts tests
      - run: python scripts/check_reference.py --require-complete --photos
      - run: python -m unittest discover -s tests -v
      - run: python scripts/update_rhythm_review.py --check
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m metronotation --check
          python -m metronotation -o study.html
