[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metro-notation"
dynamic = ["version"]
description = "Remember Rubik's Cube algorithms as metro-style diagrams"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Takashi Kitao"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/kitao/metro-notation"

[project.optional-dependencies]
pdf = ["playwright==1.63.0"]
dev = ["build>=1.2", "pypdf>=5,<7", "ruff==0.16.8"]

[project.scripts]
metro-notation = "metronotation.cli:main"

[tool.setuptools]
packages = ["metronotation", "metronotation.reference"]
include-package-data = false
package-dir = {"metronotation.reference" = "data/tribox-cfop-b-1.0"}

[tool.setuptools.dynamic]
version = {attr = "metronotation.__version__"}

[tool.setuptools.package-data]
metronotation = ["assets/*.css", "assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/fonts/*.md"]
"metronotation.reference" = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
