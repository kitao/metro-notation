[dependency-groups]
dev = ["playwright==1.63.0", "pypdf>=5,<7", "ruff==0.16.8"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"src/metronotation/__main__.py" = ["E402"]
